{{ define "main" }}
<div style="display: flex; gap: 2rem; max-width: 1200px; margin: 0 auto; padding: 1rem;">
  <nav style="min-width: 220px; border-right: 1px solid var(--color-border); padding-right: 1rem;">
    <h3>Documentation</h3>
    <ul style="list-style: none; padding: 0;">
      {{ range .Pages.ByWeight }}
        <li style="margin: 0.5rem 0;">
          <a href="{{ .RelPermalink }}" style="text-decoration: none;">
            {{ if .Title }}{{ .Title }}{{ else }}{{ .Name }}{{ end }}
          </a>
        </li>
      {{ end }}
    </ul>
  </nav>
  <main style="flex: 1; min-width: 0;">
    {{ .Content }}
  </main>
</div>
{{ end }}
