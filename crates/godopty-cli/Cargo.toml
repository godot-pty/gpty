[package]
name = "godopty-cli"
version = "0.3.0"
edition = "2024"
description = "godopty CLI — control the terminal workspace over JSON-RPC IPC"

[[bin]]
name = "godopty"
path = "src/main.rs"

[dependencies]
godopty-core = { path = "../godopty-core" }
godopty-ipc = { path = "../godopty-ipc" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
