[package]
name = "godopty-core"
version = "0.3.0"
edition = "2024"
description = "Core library for godopty: PTY management, terminal parsing, and concept-based orchestration"

[dependencies]
tokio = { version = "1", features = ["full"] }
regex = "1"
portable-pty = "0.9"
vte = "0.15"
log = "0.4"
alacritty_terminal = "0.26.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
