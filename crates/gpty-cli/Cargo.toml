[package]
name = "gpty"
version = "0.7.0"
edition = "2024"
description = "gpty CLI — control the terminal workspace over JSON-RPC IPC"
license = "GPL-3.0-or-later"
repository = "https://github.com/godot-pty/gpty"
homepage = "https://gpty.dev"
keywords = ["cli", "terminal", "mcp", "json-rpc", "agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "gpty"
path = "src/main.rs"

[dependencies]
gpty-ipc = { path = "../gpty-ipc", version = "0.7.0" }
gpty-core = { path = "../gpty-core", version = "0.7.0" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6.0.0"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
