[package]
name = "gpty"
version = "0.4.0"
edition = "2024"
description = "gpty CLI — control the terminal workspace over JSON-RPC IPC"

[[bin]]
name = "gpty"
path = "src/main.rs"

[dependencies]
gpty-core = { path = "../gpty-core" }
gpty-ipc = { path = "../gpty-ipc" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
