[package]
name = "gpty-ai"
version = "0.7.1"
edition = "2024"
description = "Pluggable AI backends for gpty Inspector panes (mock, Oh-My-Pi RPC, future LLM providers)"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "io-util", "macros", "time"] }
log = "0.4"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Test-only: `TempDir` removes a test's generated scripts and their directory
# when the guard drops, including on a panic, so a gate run leaves nothing
# behind (v0.7.2).
tempfile = "3"
