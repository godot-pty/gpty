[package]
name = "gpty-media"
version = "0.7.2"
edition = "2024"
description = "Media probe and decode backend for gpty: demux/decode through a pinned FFmpeg build"
license = "GPL-3.0-or-later"

[dependencies]
ffmpeg-the-third = { version = "6.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
log = "0.4"
libc = "0.2"

[dev-dependencies]
# Test-only: `TempDir` removes a test's scratch files and directories when the
# guard drops, including on a panic, so a gate run leaves nothing behind
# (v0.7.2).
tempfile = "3"
