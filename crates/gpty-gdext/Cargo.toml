[package]
name = "gpty-gdext"
version = "0.4.0"
edition = "2024"
description = "Godot 4 GDExtension for gpty — bridges the Rust terminal engine to Godot's renderer"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5", features = ["api-4-4"] }
gpty-core = { path = "../gpty-core" }
gpty-ai = { path = "../gpty-ai" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
log = "0.4"
regex = "1"

gpty-ipc = { path = "../gpty-ipc" }
serde_json = "1"
pulldown-cmark = "0.13.4"

[dev-dependencies]
serial_test = "3"
