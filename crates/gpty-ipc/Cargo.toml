[package]
name = "gpty-ipc"
version = "0.7.0"
edition = "2024"
description = "JSON-RPC IPC transport, client, and server for gpty workspace control"
license = "GPL-3.0-or-later"
repository = "https://github.com/godot-pty/gpty"
homepage = "https://gpty.dev"
keywords = ["json-rpc", "ipc", "terminal"]
categories = ["asynchronous"]

[dependencies]
gpty-core = { path = "../gpty-core", version = "0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync"] }
thiserror = "2"
log = "0.4"

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["net"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies.tokio]
version = "1"
features = ["net"]

