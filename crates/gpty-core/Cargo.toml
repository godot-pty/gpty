[package]
name = "gpty-core"
version = "0.8.6"
edition = "2024"
description = "Core library for gpty: PTY management, terminal parsing, and concept-based orchestration"
license = "GPL-3.0-or-later"
repository = "https://github.com/godot-pty/gpty"
homepage = "https://gpty.dev"
keywords = ["terminal", "pty", "terminal-emulator", "grid", "capture"]
categories = ["command-line-utilities", "parsing"]

[dependencies]
tokio = { version = "1", features = ["full"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vte = "0.15"
log = "0.4"
alacritty_terminal = "0.26.0"
# Colour-scheme import parses Alacritty TOML without a second format reader.
toml = "1.1"
# `fuzz/` is its own workspace but resolves this manifest through a path
# dependency, so a version bump here has to regenerate `Cargo.lock` and
# `fuzz/Cargo.lock` together.
rusqlite = { version = "0.43", features = ["bundled"] }

[dev-dependencies]
# Test-only: `TempDir` removes a test's files and directories when the guard
# drops, including on a panic, so a gate run leaves nothing behind (v0.7.2).
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
