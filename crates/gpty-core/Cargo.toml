[package]
name = "gpty-core"
version = "0.7.1"
edition = "2024"
description = "Core library for gpty: PTY management, terminal parsing, and concept-based orchestration"
license = "GPL-3.0-or-later"
repository = "https://github.com/godot-pty/gpty"
homepage = "https://gpty.dev"
keywords = ["terminal", "pty", "terminal-emulator", "grid", "capture"]
categories = ["command-line-utilities", "parsing"]

[dependencies]
tokio = { version = "1", features = ["full"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
vte = "0.15"
log = "0.4"
alacritty_terminal = "0.26.0"
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
# Test-only: `TempDir` removes a test's files and directories when the guard
# drops, including on a panic, so a gate run leaves nothing behind (v0.7.2).
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
