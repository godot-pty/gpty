[package]
name = "gpty-core"
version = "0.3.1"
edition = "2024"
description = "Core library for gpty: PTY management, terminal parsing, and concept-based orchestration"

[dependencies]
tokio = { version = "1", features = ["full"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
vte = "0.15"
log = "0.4"
alacritty_terminal = "0.26.0"
rusqlite = { version = "0.31", features = ["bundled"] }
