{{/* A short looping demo clip: {{< video "demo-showcase" >}} plays docs/static/images/demo-showcase.{webm,mp4}.
     Every clip goes through this shortcode: it resolves the URL and offers both codecs. */}}
{{ $name := .Get 0 }}
<video autoplay loop muted playsinline controls preload="metadata" style="width:100%;border-radius:8px">
  <source src="{{ printf "images/%s.webm" $name | relURL }}" type="video/webm">
  <source src="{{ printf "images/%s.mp4" $name | relURL }}" type="video/mp4">
</video>
