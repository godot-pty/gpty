baseURL: https://gpty.dev/
locale: en-us
title: gPTY

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Plugins
      pageRef: /plugins
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 3
    - identifier: versions
      name: Versions
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: Reddit
      weight: 6
      url: https://www.reddit.com/r/gPTY/
      params:
        icon: reddit
    - name: GitHub
      weight: 7
      url: https://github.com/godot-pty/gpty
      params:
        icon: github

# The favicon set lives with the brand source at the repo root, so the app and
# the site have one place to update. Everything in that directory is served at
# the site root, which is where Hextra's favicons partial looks for it.
staticDir:
  - static
  - ../assets/site-icons

params:
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: true
    displayPoweredBy: true
  theme:
    default: system
    displayToggle: true

# SECURITY.md (mirrored into /docs/security/) uses :white_check_mark: / :x: in
# its tables; GitHub renders them, so the site must too.
enableEmoji: true
