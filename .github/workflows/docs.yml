name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "LICENSE"
      - "LICENSE-EXCEPTIONS.md"
      - "crates/**/README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          # Extract ONLY the binary: the tarball also ships README.md/LICENSE
          # which would clobber the repo-root copies the mirror step reads.
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz hugo
          sudo mv hugo /usr/local/bin/

      - name: Copy repo docs into site
        run: cd docs && ./setup.sh

      - name: Build site
        run: cd docs && hugo

      - name: Verify mirrored README baked into overview
        run: |
          OVERVIEW=docs/public/docs/overview/index.html
          if ! grep -q "Agent Development Environment" "$OVERVIEW"; then
            echo "=== built overview head (first 1200 bytes) ==="
            head -c 1200 "$OVERVIEW"
            echo
            echo "=== assets/repo/README.md head (first 300 bytes) ==="
            head -c 300 docs/assets/repo/README.md 2>/dev/null || echo "(missing)"
            exit 1
          fi
          ! grep -q "static site generator" "$OVERVIEW"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
