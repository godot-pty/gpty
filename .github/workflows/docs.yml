name: Docs

on:
  push:
    branches: [main, "release/v*"]
    paths:
      - "docs/**"
      # The site's favicon set is mounted into the Hugo build from here.
      - "assets/site-icons/**"
      # Editing this workflow must run it, or a fix to the build/verify steps
      # cannot be validated by the job it repairs.
      - ".github/workflows/docs.yml"
      - "scripts/docs-check"
      - "scripts/check-capabilities"
      - "scripts/roadmap"
      - "scripts/roadmap_lib.py"
      # The knowledge bundle ships inside the app and is generated from
      # `docs/content/wiki`, so a wiki-only commit changes this file and must
      # still be validated here - CI ignores documentation-only pushes.
      - "godot/knowledge.json"
      - "scripts/build-wiki"
      # The documentation bundle ships inside the app too, generated from the
      # README's Markdown closure; a README-only edit changes it and must be
      # validated here for the same reason as the knowledge bundle.
      - "godot/docs.json"
      - "scripts/build-docs"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "RELEASING.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "SUBPROJECTS.md"
      - "LICENSE"
      - "LICENSE-EXCEPTIONS.md"
      - "crates/**/README.md"
  pull_request:
    branches: [main, "release/v*"]
    paths:
      - "docs/**"
      - "assets/site-icons/**"
      - ".github/workflows/docs.yml"
      - "scripts/docs-check"
      - "scripts/check-capabilities"
      - "scripts/roadmap"
      - "scripts/roadmap_lib.py"
      - "godot/knowledge.json"
      - "scripts/build-wiki"
      # The documentation bundle ships inside the app too, generated from the
      # README's Markdown closure; a README-only edit changes it and must be
      # validated here for the same reason as the knowledge bundle.
      - "godot/docs.json"
      - "scripts/build-docs"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "RELEASING.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "SUBPROJECTS.md"
      - "LICENSE"
      - "LICENSE-EXCEPTIONS.md"
      - "crates/**/README.md"
  workflow_dispatch:

# Least privilege: jobs inherit this unless they declare their own block (the
# deploy job declares the Pages, OIDC and artifact-list scopes it needs). A new
# job added here must not silently inherit the repository default.
permissions:
  contents: read

# One deploy at a time. Two runs deploying at once is the failure, not a race
# worth running: the newer one is refused with "Deployment request failed …
# due to in progress deployment" (400). Queue rather than cancel, so every
# push's content steps still run; GitHub keeps only the newest pending run,
# which is the one that must deploy last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.170.0/hugo_extended_0.170.0_linux-amd64.tar.gz
          # The release tag is mutable; the hash is the pin (from the release's
          # hugo_0.170.0_checksums.txt, verified against the downloaded archive).
          echo "0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0  hugo_extended_0.170.0_linux-amd64.tar.gz" | sha256sum -c -
          # Extract ONLY the binary: the tarball also ships README.md/LICENSE
          # which would clobber the repo-root copies the mirror step reads.
          tar -xzf hugo_extended_0.170.0_linux-amd64.tar.gz hugo
          sudo mv hugo /usr/local/bin/

      - name: Check markdown (links, roadmap tables, split pages)
        run: ./scripts/docs-check

      # The ledger CLI is what the next-task loop reads. The selftest exercises
      # every command on a throwaway fixture; audit checks the real ledger's
      # evidence, and a shallow clone skips only its commit-hash half. No
      # writes outside the fixture.
      - name: Check the roadmap ledger
        run: ./scripts/roadmap selftest && ./scripts/roadmap audit

      # The catalogue is data, not markdown (docs-check skips docs/data/), so
      # nothing else reads it. It stats every evidence path and joins every
      # `row` to a roadmap ID; no build, milliseconds.
      - name: Check the capability catalogue
        run: ./scripts/check-capabilities

      # The bundle is tracked and generated; a stale one would ship an app
      # whose wiki disagrees with the notes. This is the only place CI can
      # see it, because a docs-only push skips the code workflow.
      - name: Verify the knowledge bundle is current
        run: ./scripts/build-wiki --check

      # Same rule for the documentation bundle: the README is the source, and
      # a stale bundle would ship a Settings > About page that disagrees with it.
      - name: Verify the docs bundle is current
        run: ./scripts/build-docs --check

      - name: Copy repo docs into site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cd docs && ./setup.sh

      - name: Build site
        run: cd docs && hugo

      - name: Verify mirrored README baked into overview
        run: |
          OVERVIEW=docs/public/docs/overview/index.html

          # setup.sh mirrors README.md into the Hugo assets. The Hugo tarball
          # ships a README.md of its own, so compare against the repo copy
          # instead of a hard-coded phrase that drifts when the prose changes.
          if ! cmp -s README.md docs/assets/repo/README.md; then
            echo "=== docs/assets/repo/README.md is not the repo README ==="
            head -c 300 docs/assets/repo/README.md 2>/dev/null || echo "(missing)"
            exit 1
          fi

          # Canary drawn from the README itself: a run of seven or more bare
          # words renders verbatim, so editing prose never breaks the check.
          PHRASE=$(grep -oE '[A-Za-z0-9]+( [A-Za-z0-9]+){6,}' README.md | head -1 || true)
          if [ -z "$PHRASE" ] || ! grep -Fq "$PHRASE" "$OVERVIEW"; then
            echo "=== built overview head (first 1200 bytes) ==="
            head -c 1200 "$OVERVIEW" 2>/dev/null || echo "(missing)"
            echo
            echo "expected phrase: ${PHRASE:-none found in README.md}"
            exit 1
          fi

          if grep -q "static site generator" "$OVERVIEW"; then
            echo "=== overview carries Hugo's stock README, not gPTY's ==="
            exit 1
          fi

      - name: Verify the split pages rendered and are linked
        run: |
          # ROADMAP.md, CHANGELOG.md and AGENTS.md are indexes over one page per
          # chain / release / topic. Each page must have been built, and the
          # section index must link it: the shortcode rewrites the repo paths
          # into site URLs, so a broken rewrite shows up here, not in production.
          for section in roadmap changelog agents; do
            INDEX="docs/public/docs/$section/index.html"
            [ -f "$INDEX" ] || { echo "=== $INDEX was not built ==="; exit 1; }
            for page in docs/content/docs/$section/*.md; do
              name=$(basename "$page" .md)
              [ "$name" = "_index" ] && continue
              [ -f "docs/public/docs/$section/$name/index.html" ] \
                || { echo "=== $section/$name was not built ==="; exit 1; }
              grep -q "docs/$section/$name/" "$INDEX" \
                || { echo "=== $section index does not link $name ==="; exit 1; }
            done
          done

      - name: Verify security.txt is served
        run: |
          # RFC 9116 discovery for the reporting policy; the file is static, so a
          # deleted or renamed copy would otherwise deploy silently.
          file=docs/public/.well-known/security.txt
          [ -f "$file" ] || { echo "=== $file was not built ==="; exit 1; }
          for field in 'Contact: mailto:gpty.dev@outlook.com' \
                       'Canonical: https://gpty.dev/.well-known/security.txt'; do
            grep -qxF "$field" "$file" \
              || { echo "=== security.txt is missing: $field ==="; exit 1; }
          done
          grep -qE '^Expires: [0-9]{4}-[0-9]{2}-[0-9]{2}T' "$file" \
            || { echo "=== security.txt has no RFC 9116 Expires ==="; exit 1; }

      - name: Verify the plugin catalog rendered
        run: |
          # The catalog fetches the registry at build time and falls back to the
          # committed snapshot, so a page with neither an installable entry nor
          # the shortcode's "no plugins" notice means the shortcode itself broke:
          # fail the deploy instead of publishing an empty catalog silently.
          PLUGINS=docs/public/plugins/index.html
          if ! grep -q "plugin install godot-pty/" "$PLUGINS" \
              && ! grep -q "No plugins are listed" "$PLUGINS"; then
            echo "=== plugins page rendered neither an entry nor the notice ==="
            head -c 800 "$PLUGINS" 2>/dev/null || echo "(missing)"
            exit 1
          fi

      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public/
          # RFC 9116 serves .well-known/security.txt; the action excludes hidden
          # paths unless this is enabled (SEC-55).
          include-hidden-files: true

  # Deploy from its own job so `gh run rerun --failed` re-runs only this job: a
  # rerun of a job that uploads would add a second `github-pages` artifact to
  # the run, and deploy-pages refuses that ("Multiple artifacts named
  # \"github-pages\" were unexpectedly found … Artifact count is 2").
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A stuck deployment holds the `pages` group for every later run.
    timeout-minutes: 15
    permissions:
      actions: read # list this run's artifacts (the wait below)
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # deploy-pages reads the artifact through the REST API the moment the
          # upload finalises, and that list can lag by a fraction of a second -
          # which is fatal (run 42688595589: "Finalizing artifact upload" at
          # 19:59:37.397, "Found 0 artifact(s)" at 19:59:37.790). Poll the
          # precondition instead of hoping the list caught up.
          for _ in $(seq 1 30); do
            count=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            case "$count" in
              0) sleep 2 ;;
              1) echo "the github-pages artifact is visible"; exit 0 ;;
              *)
                echo "this run holds ${count} github-pages artifacts; rerun only the failed job" >&2
                exit 1
                ;;
            esac
          done
          echo "the build job's github-pages artifact never became visible" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
