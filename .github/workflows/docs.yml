name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # Editing this workflow must run it, or a fix to the build/verify steps
      # cannot be validated by the job it repairs.
      - ".github/workflows/docs.yml"
      - "scripts/docs-check"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "LICENSE"
      - "LICENSE-EXCEPTIONS.md"
      - "crates/**/README.md"
  workflow_dispatch:

# Least privilege: jobs inherit this unless they declare their own block (the
# build job does, for Pages and the OIDC token). A new job added here must not
# silently inherit the repository default.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          # The release tag is mutable; the hash is the pin (from the release's
          # hugo_0.164.0_checksums.txt, verified against the downloaded archive).
          echo "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4  hugo_extended_0.164.0_linux-amd64.tar.gz" | sha256sum -c -
          # Extract ONLY the binary: the tarball also ships README.md/LICENSE
          # which would clobber the repo-root copies the mirror step reads.
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz hugo
          sudo mv hugo /usr/local/bin/

      - name: Check markdown (links, roadmap tables, split pages)
        run: ./scripts/docs-check

      - name: Copy repo docs into site
        run: cd docs && ./setup.sh

      - name: Build site
        run: cd docs && hugo

      - name: Verify mirrored README baked into overview
        run: |
          OVERVIEW=docs/public/docs/overview/index.html

          # setup.sh mirrors README.md into the Hugo assets. The Hugo tarball
          # ships a README.md of its own, so compare against the repo copy
          # instead of a hard-coded phrase that drifts when the prose changes.
          if ! cmp -s README.md docs/assets/repo/README.md; then
            echo "=== docs/assets/repo/README.md is not the repo README ==="
            head -c 300 docs/assets/repo/README.md 2>/dev/null || echo "(missing)"
            exit 1
          fi

          # Canary drawn from the README itself: a run of seven or more bare
          # words renders verbatim, so editing prose never breaks the check.
          PHRASE=$(grep -oE '[A-Za-z0-9]+( [A-Za-z0-9]+){6,}' README.md | head -1 || true)
          if [ -z "$PHRASE" ] || ! grep -Fq "$PHRASE" "$OVERVIEW"; then
            echo "=== built overview head (first 1200 bytes) ==="
            head -c 1200 "$OVERVIEW" 2>/dev/null || echo "(missing)"
            echo
            echo "expected phrase: ${PHRASE:-none found in README.md}"
            exit 1
          fi

          if grep -q "static site generator" "$OVERVIEW"; then
            echo "=== overview carries Hugo's stock README, not gPTY's ==="
            exit 1
          fi

      - name: Verify the split pages rendered and are linked
        run: |
          # ROADMAP.md, CHANGELOG.md and AGENTS.md are indexes over one page per
          # chain / release / topic. Each page must have been built, and the
          # section index must link it: the shortcode rewrites the repo paths
          # into site URLs, so a broken rewrite shows up here, not in production.
          for section in roadmap changelog agents; do
            INDEX="docs/public/docs/$section/index.html"
            [ -f "$INDEX" ] || { echo "=== $INDEX was not built ==="; exit 1; }
            for page in docs/content/docs/$section/*.md; do
              name=$(basename "$page" .md)
              [ "$name" = "_index" ] && continue
              [ -f "docs/public/docs/$section/$name/index.html" ] \
                || { echo "=== $section/$name was not built ==="; exit 1; }
              grep -q "docs/$section/$name/" "$INDEX" \
                || { echo "=== $section index does not link $name ==="; exit 1; }
            done
          done

      - name: Verify the plugin catalog rendered
        run: |
          # The catalog fetches the registry at build time and falls back to the
          # committed snapshot, so a page with neither an installable entry nor
          # the shortcode's "no plugins" notice means the shortcode itself broke:
          # fail the deploy instead of publishing an empty catalog silently.
          PLUGINS=docs/public/plugins/index.html
          if ! grep -q "plugin install godot-pty/" "$PLUGINS" \
              && ! grep -q "No plugins are listed" "$PLUGINS"; then
            echo "=== plugins page rendered neither an entry nor the notice ==="
            head -c 800 "$PLUGINS" 2>/dev/null || echo "(missing)"
            exit 1
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
