name: MCP Registry

# Publishes server.json to the official MCP registry when a release's workflow
# completes, not when the release is published: release.yml creates the release
# with the workflow's `GITHUB_TOKEN`, and GitHub starts no run for an event that
# token produced, so `release: [published]` never fired for any release this
# repository published (v0.7.1's entry exists only because the workflow was
# dispatched by hand). `workflow_run` fires on the Release run's completion -
# that run was started by the tag push, not by a token - and only after a
# successful one, so a release that failed to build publishes nothing.
#
# Separate from release.yml on purpose. The release artifacts are the primary
# artifact and must not be blocked by a registry outage, but a failed publish
# has to stay visible: a green release with no registry entry is exactly the
# silent failure this job exists to prevent.
#
# No secret is involved. Authentication is this workflow's OIDC identity, which
# the registry maps to the `io.github.godot-pty` namespace - a crates.io token
# or PAT here would turn "can push a v* tag" into "can publish in the project's
# name" (see the v0.7.1 tag-ruleset row).
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # First publication, a descriptor fix for a version whose release already
  # ran, or a release created outside the Release workflow. Publishes whatever
  # server.json says on the selected ref.
  workflow_dispatch:

# Least privilege: reading the repository is all this job needs beyond the OIDC
# token it declares for itself. Without a top-level block every job inherits the
# repository default (read-write on repositories created before February 2023).
permissions:
  contents: read

# Two runs publishing at once would race on the same server name; a queued run
# is fine, a cancelled one is not (the registry may already have taken it).
concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A failed or cancelled release run publishes nothing. A prerelease is
    # skipped by the resolve step (`publish=false`), because the `workflow_run`
    # payload carries no release object to read that flag from.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # `mcp-publisher login github-oidc`
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      # The `workflow_run` payload names the tag, not the release: resolve the
      # release the run produced and carry it to every later step. A prerelease
      # stops here as `publish=false`; for a dispatch the outputs stay empty and
      # the `!= 'false'` gates below let the job run against the selected ref.
      - name: Resolve the release
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "the Release run's head_branch is '${TAG}', not a v* tag" >&2; exit 1 ;;
          esac
          if ! release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"); then
            echo "the Release run for ${TAG} concluded successfully but no release exists for that tag" >&2
            exit 1
          fi
          if [ "$(jq -r .prerelease <<<"${release}")" = "true" ]; then
            echo "${TAG} is a prerelease; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.release.outputs.publish != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released tree, not the default branch: server.json must be the
          # one the tag carries. A dispatched run checks out its selected ref.
          ref: ${{ steps.release.outputs.tag || github.ref }}

      # The descriptor is the claim the registry stores, and the registry only
      # checks the package at publish time. Fail here, with a message that says
      # what to fix, instead of inside the publisher's error.
      - name: Check the descriptor
        if: steps.release.outputs.publish != 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 scripts/mcp-registry check
          VERSION=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          if [ -n "${TAG}" ] && [ "v${VERSION}" != "${TAG}" ]; then
            echo "server.json publishes ${VERSION}, but this release is ${TAG}" >&2
            echo "bump server.json with the crates in the release commit (step 5 of the release skill)" >&2
            exit 1
          fi
          # The registry verifies package existence at publish; ask crates.io
          # first so a missing publish reads as one, not as a registry error.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: gpty-release-check (github.com/godot-pty/gpty)" \
            "https://crates.io/api/v1/crates/gpty/${VERSION}")
          if [ "${code}" != "200" ]; then
            echo "gpty ${VERSION} is not on crates.io (HTTP ${code}); publish the crates first" >&2
            exit 1
          fi

      - name: Install cosign
        if: steps.release.outputs.publish != 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pinned release, verified against the publisher's own Sigstore bundle
      # before it runs: `releases/latest` is mutable and this binary holds the
      # credential that publishes under the project's name.
      - name: Download and verify mcp-publisher
        if: steps.release.outputs.publish != 'false'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --version

      - name: Validate and publish
        if: steps.release.outputs.publish != 'false'
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
