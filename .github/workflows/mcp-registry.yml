name: MCP Registry

# Publishes server.json to the official MCP registry.
#
# Chained from release.yml after `publish-crates` (workflow_call); manual
# dispatch remains for a descriptor repair, a first publication, or a release
# created outside the Release workflow. The registry refuses a crate version
# that is not on crates.io, so the pre-check retries while the index catches up
# instead of racing the publish. `workflow_run` is not used: it cannot pass the
# tag ref and scripts/lint-workflows rejects it.
#
# Separate from release.yml on purpose. The release artifacts are the primary
# artifact and must not be blocked by a registry outage, but a failed publish
# has to stay visible: a green release with no registry entry is exactly the
# silent failure this job exists to prevent.
#
# The descriptor is read through the contents API at the caller's ref, and the
# validator always comes from `main`: this job holds `id-token: write`, so a
# tree fetched by an event-derived ref must not be executed (code scanning
# alert 13). A consequence is that publishing an old tag uses the current
# validator - which is the point: the checks are the ones this repository
# enforces now, not the ones the tag shipped.
#
# No secret is involved. Authentication is this workflow's OIDC identity, which
# the registry maps to the `io.github.godot-pty` namespace.
on:
  workflow_call:
  # First publication, a descriptor fix for a version whose release already
  # ran, or a release created outside the Release workflow. Publishes whatever
  # server.json says on the selected ref, after the crates are live.
  workflow_dispatch:

# Least privilege: reading the repository is all this job needs beyond the OIDC
# token it declares for itself. Without a top-level block every job inherits the
# repository default (read-write on repositories created before February 2023).
permissions:
  contents: read

# Two runs publishing at once would race on the same server name; a queued run
# is fine, a cancelled one is not (the registry may already have taken it).
concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: read
      id-token: write # `mcp-publisher login github-oidc`
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      # The published tree is data here, never code. This job holds
      # `id-token: write` and publishes under the project's name, so checking
      # out an event-derived ref and running anything from it is the pwn request
      # the actions/untrusted-checkout rules describe (code scanning alert 13).
      # The validator is default-branch code - the same source this workflow
      # file is served from - and the descriptor is read through the contents
      # API at the dispatched ref.
      - name: Checkout the validator (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A literal: the checkout never follows a dispatched ref, even though
          # a manual dispatch is less exposed than an event-derived one.
          ref: main
          persist-credentials: false

      - name: Fetch the descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/descriptor"
          mkdir -p "${root}/crates/gpty-cli"
          for path in server.json crates/gpty-cli/Cargo.toml crates/gpty-cli/README.md; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${REF}" \
              -H "Accept: application/vnd.github.raw" > "${root}/${path}"
          done
          echo "DESCRIPTOR_ROOT=${root}" >> "$GITHUB_ENV"

      # The descriptor is the claim the registry stores, and the registry only
      # checks the package at publish time. Fail here, with a message that says
      # what to fix, instead of inside the publisher's error. The validator runs
      # from the default branch against the staged copy, so the checks CI runs
      # on the tree apply to the descriptor this run would publish.
      - name: Check the descriptor
        run: |
          set -euo pipefail
          python3 scripts/mcp-registry check "$DESCRIPTOR_ROOT"
          VERSION=$(jq -r .version "$DESCRIPTOR_ROOT/server.json")
          # The registry verifies package existence at publish; ask crates.io
          # first so a missing publish reads as one, not as a registry error.
          # Chained runs arrive seconds after `cargo publish`, so poll the
          # index instead of racing it.
          code=""
          for _ in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "User-Agent: gpty-release-check (github.com/godot-pty/gpty)" \
              "https://crates.io/api/v1/crates/gpty/${VERSION}")
            [ "${code}" = "200" ] && break
            sleep 5
          done
          if [ "${code}" != "200" ]; then
            echo "gpty ${VERSION} is not on crates.io (HTTP ${code}); publish the crates first" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Pinned release, verified against the publisher's own Sigstore bundle
      # before it runs: `releases/latest` is mutable and this binary holds the
      # credential that publishes under the project's name.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          cd "$DESCRIPTOR_ROOT"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --version

      - name: Validate and publish
        run: |
          set -euo pipefail
          cd "$DESCRIPTOR_ROOT"
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
