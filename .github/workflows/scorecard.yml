name: Scorecard

# The supply-chain posture the repository already asserts - SHA-pinned actions,
# attested release assets, checksum-verified CI downloads - read back by an
# outside tool instead of by our own rules. Results go to the Security tab as
# SARIF and, with `publish_results`, to the public OpenSSF API; the first run
# after a push is the baseline the roadmap row records.
on:
  # A change to the default branch's protection rules can move the score.
  branch_protection_rule:
  schedule:
    # Weekly, off the hour and off the other scheduled workflow.
    - cron: "41 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # publish_results signs with the run's identity
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The raw report is what the roadmap row pastes from; the SARIF is the
      # same run read by the Security tab and by an outside reviewer.
      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
