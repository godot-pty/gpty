name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: the gate, build and export jobs only read the repository.
# `publish` overrides it with exactly the writes it needs: release contents,
# plus the OIDC identity the build-provenance attestation signs with. The
# publish job downloads the staged files and runs only pinned actions - no
# project code runs in the job that holds the write token or the OIDC identity.
permissions:
  contents: read

# One release per tag. A re-pushed tag queues instead of racing a publish.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GDE_BIN: godot/bin

jobs:
  # ── Build GDExtension per platform ───────────────────────────────────
  build-linux:
    needs: release-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"

      - name: Build media dependencies
        run: ./scripts/media-deps

      - name: Build GDExtension (release)
        run: cargo build --locked -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build --locked -p gpty --release

      - name: Package
        run: |
          mkdir -p release/ffmpeg/lib release/ffmpeg/licenses
          cp target/release/libgpty_gdext.so release/libgpty_gdext.linux.x86_64.so
          cp target/release/gpty release/gpty
          cp -a dist/ffmpeg/linux-x86_64/lib/libav*.so* release/ffmpeg/lib/
          cp -a dist/ffmpeg/linux-x86_64/lib/libsw*.so* release/ffmpeg/lib/
          cp -a dist/ffmpeg/linux-x86_64/licenses/. release/ffmpeg/licenses/
          cp dist/ffmpeg/linux-x86_64/components.txt release/ffmpeg/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpty-linux-x86_64
          path: release/

  build-macos:
    needs: release-gate
    strategy:
      matrix:
        target:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"

      - name: Build media dependencies
        run: ./scripts/media-deps

      - name: Build GDExtension (release)
        run: cargo build --locked -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build --locked -p gpty --release

      - name: Package
        run: |
          mkdir -p release/ffmpeg/lib release/ffmpeg/licenses
          cp target/release/libgpty_gdext.dylib release/libgpty_gdext.macos.${{ matrix.target.arch }}.dylib
          cp dist/ffmpeg/macos-${{ matrix.target.arch }}/lib/libav*.dylib release/ffmpeg/lib/
          cp dist/ffmpeg/macos-${{ matrix.target.arch }}/lib/libsw*.dylib release/ffmpeg/lib/
          cp -a dist/ffmpeg/macos-${{ matrix.target.arch }}/licenses/. release/ffmpeg/licenses/
          cp dist/ffmpeg/macos-${{ matrix.target.arch }}/components.txt release/ffmpeg/
          if [ "${{ matrix.target.arch }}" = "arm64" ]; then
            # The app export is universal, so the CLI that ships inside it must be too.
            rustup target add x86_64-apple-darwin
            cargo build --locked -p gpty --release --target x86_64-apple-darwin
            lipo -create -output release/gpty target/release/gpty target/x86_64-apple-darwin/release/gpty
          else
            cp target/release/gpty release/gpty
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpty-macos-${{ matrix.target.arch }}
          path: release/

  # The macOS app is universal while each build runner has one arch's FFmpeg.
  # Combine them here (lipo needs macOS) and ad-hoc sign the results so the
  # export job can inject pre-signed libraries without touching a signature.
  bundle-macos:
    needs: [release-gate, build-macos]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Build universal FFmpeg libraries
        run: |
          ./scripts/bundle-media macos-libs release/ffmpeg \
            artifacts/gpty-macos-arm64/ffmpeg \
            artifacts/gpty-macos-x86_64/ffmpeg

      - name: Upload universal FFmpeg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpty-macos-ffmpeg
          path: release/ffmpeg

  build-windows:
    needs: release-gate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"

      - name: Cache vcpkg FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: vcpkg-ffmpeg-${{ runner.os }}-9.0.2
          restore-keys: |
            vcpkg-ffmpeg-${{ runner.os }}-

      - name: Build media dependencies
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT || 'C:/vcpkg' }}
        run: ./scripts/media-deps

      - name: Build GDExtension (release)
        run: cargo build --locked -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build --locked -p gpty --release

      - name: Package
        run: |
          mkdir release
          mkdir release\ffmpeg
          mkdir release\ffmpeg\bin
          mkdir release\ffmpeg\licenses
          copy target\release\gpty_gdext.dll release\gpty_gdext.windows.x86_64.dll
          copy target\release\gpty.exe release\gpty.exe
          copy "$env:FFMPEG_DIR\bin\*.dll" release\ffmpeg\bin\
          xcopy /y /q "dist\ffmpeg\windows-x86_64\licenses\*" release\ffmpeg\licenses\
          copy "dist\ffmpeg\windows-x86_64\components.txt" release\ffmpeg\

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpty-windows-x86_64
          path: release/

  # ── Release gate: tag, version and content checks before any build ───
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The defect-class gate describes the previous tag; the default
          # shallow clone carries neither the tag nor the history to find it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"

      - name: Check the tag format
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "release tags are vX.Y.Z (got $VERSION)" >&2; exit 1; }

      - name: Check the tag is a signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}")"
          type="$(jq -r '.object.type' <<<"$ref")"
          sha="$(jq -r '.object.sha' <<<"$ref")"
          [ "$type" = "tag" ] || { echo "tag $VERSION is not annotated" >&2; exit 1; }
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified')"
          [ "$verified" = "true" ] || { echo "tag $VERSION is not signed/verified" >&2; exit 1; }

      - name: Check the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Check the version
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/gpty-cli/Cargo.toml | head -1)"
          test "v$crate_version" = "$VERSION"
          python3 scripts/mcp-registry check
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Check the defect-class trailers
        run: |
          # Every fix since the previous release must name its Cause. The
          # range is computed, so each `v*` tag runs the right one with no
          # version to maintain; the first release has no previous tag and
          # checks all history (the trailer rule is date-gated anyway).
          if previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null)"; then
            ./scripts/fix-forensics --check --since "$previous"
          else
            ./scripts/fix-forensics --check
          fi

      - name: Check the docs and knowledge bundle
        run: |
          python3 scripts/docs-check
          ./scripts/check-capabilities
          python3 scripts/build-wiki --check

  # ── Export standalone apps (read-only) ───────────────────────────────
  export:
    needs: [build-linux, build-macos, build-windows, bundle-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # project.godot carries the last released version; bundles must report the
      # tag (macOS reads CFBundleShortVersionString from it).
      - name: Stamp the release version into the Godot project
        run: |
          sed -i "s|^config/version=.*|config/version=\"${VERSION#v}\"|" godot/project.godot
          grep -n '^config/version=' godot/project.godot

      - name: Install Godot headless
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget unzip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          # The release tag is mutable; the hash is the pin (from the release's
          # SHA512-SUMS.txt, verified against the downloaded archive).
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  Godot_v4.7.2-stable_linux.x86_64.zip" | sha512sum -c -
          unzip Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          # Same pin as the editor build; from the release's SHA512-SUMS.txt.
          echo "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  Godot_v4.7.2-stable_export_templates.tpz" | sha512sum -c -
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p /tmp/godot-templates
          unzip -qo Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            mv /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          else
            mv /tmp/godot-templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          fi
          cd ~/.local/share/godot/export_templates/4.7.2.stable
          if [ -f macos.zip ]; then
            unzip -qo macos.zip "macos_template.app/Contents/MacOS/*" -d .
          fi
          ls -la ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Download GDExtension artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: gdext-artifacts

      - name: Stage GDExtension binaries into godot/bin/
        run: |
          mkdir -p godot/bin
          find gdext-artifacts -type f \( -name 'libgpty_gdext*' -o -name 'gpty_gdext*' \) | while read -r f; do
            cp "$f" godot/bin/
          done
          for f in libgpty_gdext.linux.x86_64.so libgpty_gdext.macos.arm64.dylib \
            libgpty_gdext.macos.x86_64.dylib gpty_gdext.windows.x86_64.dll; do
            test -s "godot/bin/$f" || { echo "missing godot/bin/$f" >&2; exit 1; }
          done
          ls -la godot/bin/

      - name: Import project
        run: godot --headless --path godot --import

      - name: Export Linux
        run: |
          B="$GITHUB_WORKSPACE/dist/gpty-${VERSION}-linux-x86_64"
          mkdir -p "$B"
          # The CLI owns the name `gpty`; the export ships beside it as `gpty-gui`
          # so `gpty <command>` can auto-spawn it (see the CLI's GUI discovery).
          godot --headless --path godot --export-release "Linux/X11" "$B/gpty-gui"
          cp gdext-artifacts/gpty-linux-x86_64/gpty "$B/"
          # actions/download-artifact does not preserve file modes, so the CLI
          # arrives 0644 (`Permission denied` when run). The GUI is exported in
          # this job and keeps +x; restore the CLI's mode before tarring.
          chmod 0755 "$B/gpty"
          cp LICENSE LICENSE-EXCEPTIONS.md "$B/"
          ./scripts/bundle-media linux "$B" gdext-artifacts/gpty-linux-x86_64/ffmpeg
          tar -czf "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-linux-x86_64.tar.gz" -C "$GITHUB_WORKSPACE/dist" "gpty-${VERSION}-linux-x86_64"

      - name: Export Windows
        run: |
          B="$GITHUB_WORKSPACE/dist/gpty-${VERSION}-windows-x86_64"
          mkdir -p "$B"
          godot --headless --path godot --export-release "Windows Desktop" "$B/gpty-gui.exe"
          cp godot/bin/gpty_gdext.windows.x86_64.dll "$B/"
          cp gdext-artifacts/gpty-windows-x86_64/gpty.exe "$B/"
          cp LICENSE LICENSE-EXCEPTIONS.md "$B/"
          ./scripts/bundle-media windows "$B" gdext-artifacts/gpty-windows-x86_64/ffmpeg
          cd "$GITHUB_WORKSPACE/dist" && zip -r "gpty-${VERSION}-windows-x86_64.zip" "gpty-${VERSION}-windows-x86_64"

      - name: Export macOS
        run: |
          godot --headless --path godot --export-release "macOS" "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip"
          # zip would happily create the archive itself, which would ship a
          # licenses-only download if the export above produced nothing.
          test -s "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip" || { echo "macOS export produced no archive"; exit 1; }
          # The bundle keeps its own name (the preset decides it); the CLI lands
          # next to it, and the CLI discovers the app under /Applications too.
          zip -j "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip" LICENSE LICENSE-EXCEPTIONS.md \
            gdext-artifacts/gpty-macos-arm64/gpty
          ./scripts/bundle-media macos-zip \
            "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip" \
            "gdext-artifacts/gpty-macos-ffmpeg"

      # Three archives and one checksum file, nothing else. The per-library
      # assets (the GDExtension and its pinned FFmpeg) are already inside each
      # archive; publishing them a second time made a 36-file release page that
      # nobody could choose from, and inflated the download counts that are the
      # project's only install signal. Entry names match the published asset
      # names (flat basenames), so a downloaded file can be checked against its
      # own line, and a missing artifact fails the job instead of shipping a
      # short list.
      - name: Generate SHA256 checksums
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "gpty-${VERSION}-linux-x86_64.tar.gz" \
                    "gpty-${VERSION}-windows-x86_64.zip" \
                    "gpty-${VERSION}-macos.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpty-release-dist
          path: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/SHA256SUMS
          retention-days: 3

  # ── Attest and publish (write token + OIDC; no project code) ─────────
  publish:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Build-provenance attestation: `actions/attest-build-provenance` signs
      # the staged artifacts with this workflow run's OIDC identity.
      id-token: write
      attestations: write
      # List/download this run's gpty-release-dist artifact.
      actions: read
    environment:
      name: release
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpty-release-dist
          path: dist

      # Bind each asset to the workflow, commit and runner that produced it:
      # `gh attestation verify <asset> --repo godot-pty/gpty`. SHA256SUMS proves
      # integrity in transit; this is what proves where the bytes came from.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/SHA256SUMS
          # A release that is silently missing an asset is worse than a failed job.
          fail_on_unmatched_files: true
          # The releases API prepends this body to the generated notes.
          body: |
            ### Verifying your download

            Every uploaded asset is listed in `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS                  # Linux
            shasum -a 256 -c SHA256SUMS              # macOS
            certutil -hashfile <asset> SHA256        # Windows
            ```

            Run that from the folder holding your download. Lines for assets you did
            not download report as missing — only your file's line has to say `OK`.

            Checksums catch a corrupted or tampered download in transit. Every asset
            also carries a **build-provenance attestation** that binds it to the
            workflow run and commit that produced it:

            ```bash
            gh attestation verify <asset> --repo godot-pty/gpty
            ```

            The binaries are not code-signed (no Authenticode or notarization yet);
            the attestation is the signature.
          generate_release_notes: true
