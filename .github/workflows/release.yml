name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  GDE_BIN: godot/bin

jobs:
  # ── Build GDExtension per platform ───────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build GDExtension (release)
        run: cargo build -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build -p gpty --release

      - name: Package
        run: |
          mkdir -p release
          cp target/release/libgpty_gdext.so release/libgpty_gdext.linux.x86_64.so
          cp target/release/gpty release/gpty

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpty-linux-x86_64
          path: release/

  build-macos:
    strategy:
      matrix:
        target:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build GDExtension (release)
        run: cargo build -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build -p gpty --release

      - name: Package
        run: |
          mkdir -p release
          cp target/release/libgpty_gdext.dylib release/libgpty_gdext.macos.${{ matrix.target.arch }}.dylib
          if [ "${{ matrix.target.arch }}" = "arm64" ]; then
            # The app export is universal, so the CLI that ships inside it must be too.
            rustup target add x86_64-apple-darwin
            cargo build -p gpty --release --target x86_64-apple-darwin
            lipo -create -output release/gpty target/release/gpty target/x86_64-apple-darwin/release/gpty
          else
            cp target/release/gpty release/gpty
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpty-macos-${{ matrix.target.arch }}
          path: release/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build GDExtension (release)
        run: cargo build -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build -p gpty --release

      - name: Package
        run: |
          mkdir release
          copy target\release\gpty_gdext.dll release\gpty_gdext.windows.x86_64.dll
          copy target\release\gpty.exe release\gpty.exe

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpty-windows-x86_64
          path: release/

  # ── Export standalone app + create GitHub Release ─────────────────────
  export-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build-provenance attestation: `actions/attest-build-provenance` signs
      # the staged artifacts with this workflow run's OIDC identity.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # project.godot carries the last released version; bundles must report the
      # tag (macOS reads CFBundleShortVersionString from it).
      - name: Stamp the release version into the Godot project
        run: |
          sed -i "s|^config/version=.*|config/version=\"${VERSION#v}\"|" godot/project.godot
          grep -n '^config/version=' godot/project.godot

      - name: Install Godot headless
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget unzip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          # The release tag is mutable; the hash is the pin (from the release's
          # SHA512-SUMS.txt, verified against the downloaded archive).
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  Godot_v4.7.2-stable_linux.x86_64.zip" | sha512sum -c -
          unzip Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          # Same pin as the editor build; from the release's SHA512-SUMS.txt.
          echo "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  Godot_v4.7.2-stable_export_templates.tpz" | sha512sum -c -
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p /tmp/godot-templates
          unzip -qo Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            mv /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          else
            mv /tmp/godot-templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          fi
          cd ~/.local/share/godot/export_templates/4.7.2.stable
          if [ -f macos.zip ]; then
            unzip -qo macos.zip "macos_template.app/Contents/MacOS/*" -d .
          fi
          ls -la ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Download GDExtension artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: gdext-artifacts

      - name: Stage GDExtension binaries into godot/bin/
        run: |
          mkdir -p godot/bin
          find gdext-artifacts -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | while read f; do
            cp "$f" godot/bin/
          done
          ls -la godot/bin/

      - name: Import project
        run: godot --headless --path godot --import

      - name: Export Linux
        run: |
          B="$GITHUB_WORKSPACE/dist/gpty-${VERSION}-linux-x86_64"
          mkdir -p "$B"
          # The CLI owns the name `gpty`; the export ships beside it as `gpty-gui`
          # so `gpty <command>` can auto-spawn it (see the CLI's GUI discovery).
          godot --headless --path godot --export-release "Linux/X11" "$B/gpty-gui"
          cp gdext-artifacts/gpty-linux-x86_64/gpty "$B/"
          cp LICENSE LICENSE-EXCEPTIONS.md "$B/"
          tar -czf "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-linux-x86_64.tar.gz" -C "$GITHUB_WORKSPACE/dist" "gpty-${VERSION}-linux-x86_64"

      - name: Export Windows
        run: |
          B="$GITHUB_WORKSPACE/dist/gpty-${VERSION}-windows-x86_64"
          mkdir -p "$B"
          godot --headless --path godot --export-release "Windows Desktop" "$B/gpty-gui.exe"
          cp godot/bin/gpty_gdext.windows.x86_64.dll "$B/" 2>/dev/null || true
          cp gdext-artifacts/gpty-windows-x86_64/gpty.exe "$B/"
          cp LICENSE LICENSE-EXCEPTIONS.md "$B/"
          cd "$GITHUB_WORKSPACE/dist" && zip -r "gpty-${VERSION}-windows-x86_64.zip" "gpty-${VERSION}-windows-x86_64"

      - name: Export macOS
        run: |
          godot --headless --path godot --export-release "macOS" "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip"
          # zip would happily create the archive itself, which would ship a
          # licenses-only download if the export above produced nothing.
          test -s "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip" || { echo "macOS export produced no archive"; exit 1; }
          # The bundle keeps its own name (the preset decides it); the CLI lands
          # next to it, and the CLI discovers the app under /Applications too.
          zip -j "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip" LICENSE LICENSE-EXCEPTIONS.md \
            gdext-artifacts/gpty-macos-arm64/gpty

      - name: Copy GDExtension artifacts for release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/gdextension"
          find gdext-artifacts -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} "$GITHUB_WORKSPACE/dist/gdextension/" \;

      # Entry names match the published asset names (flat basenames), so a
      # downloaded file can be checked against its own line. Fails loudly when
      # an expected artifact is missing rather than publishing a short list.
      - name: Generate SHA256 checksums
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "gpty-${VERSION}-linux-x86_64.tar.gz" \
                    "gpty-${VERSION}-windows-x86_64.zip" \
                    "gpty-${VERSION}-macos.zip" > SHA256SUMS
          (cd gdextension && sha256sum *) >> SHA256SUMS
          cat SHA256SUMS

      # Bind each asset to the workflow, commit and runner that produced it:
      # `gh attestation verify <asset> --repo godot-pty/gpty`. SHA256SUMS proves
      # integrity in transit; this is what proves where the bytes came from.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/gdextension/*
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/gdextension/*
            dist/SHA256SUMS
          # A release that is silently missing an asset is worse than a failed job.
          fail_on_unmatched_files: true
          # The releases API prepends this body to the generated notes.
          body: |
            ### Verifying your download

            Every uploaded asset is listed in `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS                  # Linux
            shasum -a 256 -c SHA256SUMS              # macOS
            certutil -hashfile <asset> SHA256        # Windows
            ```

            Run that from the folder holding your download. Lines for assets you did
            not download report as missing — only your file's line has to say `OK`.

            Checksums catch a corrupted or tampered download in transit. Every asset
            also carries a **build-provenance attestation** that binds it to the
            workflow run and commit that produced it:

            ```bash
            gh attestation verify <asset> --repo godot-pty/gpty
            ```

            The binaries are not code-signed (no Authenticode or notarization yet);
            the attestation is the signature.
          generate_release_notes: true
