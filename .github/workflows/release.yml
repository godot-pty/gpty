name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: the gate and the shared build workflow only read the
# repository. `publish` overrides it with exactly the writes it needs: release
# contents, plus the OIDC identity the build-provenance attestation signs with.
# The publish job downloads the staged files and runs only pinned actions - no
# project code runs in the job that holds the write token or the OIDC identity.
# `publish-crates` and `mcp-registry` request only `id-token: write` for their
# own OIDC exchanges; the former checks out the signed tag because
# `cargo publish` must run each packaged verify build.
#
# `actions: read` is what release-build.yml's export job uses to download the
# GDExtension artifacts; a called workflow can only narrow its caller's grant,
# never widen it, so the grant has to be here.
permissions:
  contents: read
  actions: read

# One release per tag. A re-pushed tag queues instead of racing a publish.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Release gate: tag, version and content checks before any build ───
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The defect-class gate describes the previous tag; the default
          # shallow clone carries neither the tag nor the history to find it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: ./scripts/install-rust

      - name: Check the tag format
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "release tags are vX.Y.Z (got $VERSION)" >&2; exit 1; }

      - name: Check the tag is a signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}")"
          type="$(jq -r '.object.type' <<<"$ref")"
          sha="$(jq -r '.object.sha' <<<"$ref")"
          [ "$type" = "tag" ] || { echo "tag $VERSION is not annotated" >&2; exit 1; }
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified')"
          [ "$verified" = "true" ] || { echo "tag $VERSION is not signed/verified" >&2; exit 1; }

      # The active line tags `main`; a line in maintenance tags its release
      # branch. Derive the branch from the tag, never from a stored name.
      - name: Check the tag is on main or its release branch
        run: |
          set -euo pipefail
          line="release/v${VERSION#v}"
          line="${line%.*}"
          git fetch --no-tags origin main
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "tag $VERSION is on main"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$line" >/dev/null; then
            git fetch --no-tags origin "$line"
            if git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "tag $VERSION is on $line"
              exit 0
            fi
          fi
          echo "tag $VERSION is not an ancestor of main or $line" >&2
          exit 1

      - name: Check the version
        run: |
          set -euo pipefail
          test "v$(./scripts/release-prepare --print-version)" = "$VERSION"
          ./scripts/release-prepare --check
          python3 scripts/mcp-registry check
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Check the defect-class trailers
        run: |
          # Every fix since the previous release must name its Cause. The
          # range is computed, so each `v*` tag runs the right one with no
          # version to maintain; the first release has no previous tag and
          # checks all history (the trailer rule is date-gated anyway).
          if previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null)"; then
            ./scripts/fix-forensics --check --since "$previous"
          else
            ./scripts/fix-forensics --check
          fi

      - name: Check the docs and knowledge bundle
        run: |
          python3 scripts/docs-check
          ./scripts/check-capabilities
          python3 scripts/build-wiki --check
          python3 scripts/build-docs --check

  # ── Build and export, from the definition the dispatch path shares ───
  build:
    needs: release-gate
    # Explicit rather than inherited: the called workflow's jobs declare the
    # same two reads, and a called workflow can only narrow what its caller
    # passes, so the call site states the grant the build actually gets.
    permissions:
      contents: read
      actions: read
    # The build and export jobs live in release-build.yml so a tag and a run
    # on main (workflow_dispatch there fills the caches a tag restores)
    # execute the same steps under the same cache keys. A called workflow uses
    # the caller's ref, so this run still builds the tag's tree.
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ github.ref_name }}

  # ── Publish the crates (crates.io trusted publishing) ────────────────
  # `cargo publish` runs each packaged verify build, so this job does run
  # project code - but it checks out the signed, gate-verified tag and holds
  # only `contents: read` plus the OIDC identity crates.io maps to this
  # repository, workflow and environment. No long-lived token exists.
  publish-crates:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: release
    steps:
      - name: Checkout the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: ./scripts/install-rust

      - name: Cache the publish verify builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-

      - name: Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish() {
            crate="$1"
            version="$(cargo metadata --locked --no-deps --format-version 1 \
              | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: gpty-release (github.com/godot-pty/gpty)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "$code" = "200" ]; then
              echo "$crate $version is already published; skipping"
              return
            fi
            cargo publish --locked -p "$crate"
            for _ in $(seq 1 60); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H 'User-Agent: gpty-release (github.com/godot-pty/gpty)' \
                "https://crates.io/api/v1/crates/${crate}/${version}")"
              [ "$code" = "200" ] && return
              sleep 5
            done
            echo "timed out waiting for $crate $version on crates.io" >&2
            exit 1
          }
          publish gpty-core
          publish gpty-ipc
          publish gpty-plugin
          publish gpty

  # ── Registry entry, chained after the crates are live ────────────────
  mcp-registry:
    needs: [publish, publish-crates]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml

  # ── Attest and publish (write token + OIDC; no project code) ─────────
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Build-provenance attestation: `actions/attest-build-provenance` signs
      # the staged artifacts with this workflow run's OIDC identity.
      id-token: write
      attestations: write
      # List/download this run's gpty-release-dist artifact.
      actions: read
    environment:
      name: release
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpty-release-dist
          path: dist

      # Bind each asset to the workflow, commit and runner that produced it:
      # `gh attestation verify <asset> --repo godot-pty/gpty`. SHA256SUMS proves
      # integrity in transit; this is what proves where the bytes came from.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/gpty-${{ github.ref_name }}.spdx.json
            dist/SHA256SUMS

      # The bundle is the signature as a file. Scorecard reads release assets,
      # not the attestation API, and its provenance probe is the `.intoto.jsonl`
      # suffix. It attests SHA256SUMS, so it is deliberately not a line inside
      # SHA256SUMS - a file cannot carry the digest of its own signature.
      - name: Stage the attestation bundle
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "dist/gpty-${{ github.ref_name }}.intoto.jsonl"
          test -s "dist/gpty-${{ github.ref_name }}.intoto.jsonl" \
            || { echo "the attestation bundle is empty" >&2; exit 1; }

      # `attest-build-provenance` has no `sbom-path` input, so the SBOM
      # predicate is signed by `actions/attest` itself: the same pinned commit
      # the wrapper calls, and the subject set is the artifacts the SBOM covers.
      # Verified with `gh attestation verify <asset> --predicate-type
      # https://spdx.dev/Document`.
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
          sbom-path: dist/gpty-${{ github.ref_name }}.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/gpty-${{ github.ref_name }}.spdx.json
            dist/gpty-${{ github.ref_name }}.intoto.jsonl
            dist/SHA256SUMS
          # A release that is silently missing an asset is worse than a failed job.
          fail_on_unmatched_files: true
          # The releases API prepends this body to the generated notes.
          body: |
            ### Verifying your download

            Every uploaded asset is listed in `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS                  # Linux
            shasum -a 256 -c SHA256SUMS              # macOS
            certutil -hashfile <asset> SHA256        # Windows
            ```

            Run that from the folder holding your download. Lines for assets you did
            not download report as missing — only your file's line has to say `OK`.

            Checksums catch a corrupted or tampered download in transit. Every asset
            also carries a **build-provenance attestation** that binds it to the
            workflow run and commit that produced it:

            ```bash
            gh attestation verify <asset> --repo godot-pty/gpty
            ```

            The binaries are not code-signed (no Authenticode or notarization yet);
            the attestation is the signature.

            ### Bill of materials

            `gpty-<version>.spdx.json` is a Software Bill of Materials for the
            three archives: every shipped file with its SHA-256, including the
            bundled FFmpeg libraries, the fonts and the colour schemes. Its
            signature is an SBOM attestation over the same artifacts:

            ```bash
            gh attestation verify <asset> --repo godot-pty/gpty \
              --predicate-type https://spdx.dev/Document
            ```

            `gpty-<version>.intoto.jsonl` is the signed provenance bundle for the
            same assets, published for tools that read a signature file instead of
            the attestation API.
          generate_release_notes: true
