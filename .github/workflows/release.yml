name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  GDE_BIN: godot/bin

jobs:
  # ── Build GDExtension per platform ───────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GDExtension (release)
        run: cargo build -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build -p gpty --release

      - name: Package
        run: |
          mkdir -p release
          cp target/release/libgpty_gdext.so release/libgpty_gdext.linux.x86_64.so
          cp target/release/gpty release/gpty

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpty-linux-x86_64
          path: release/

  build-macos:
    strategy:
      matrix:
        target:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GDExtension (release)
        run: cargo build -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build -p gpty --release

      - name: Package
        run: |
          mkdir -p release
          cp target/release/libgpty_gdext.dylib release/libgpty_gdext.macos.${{ matrix.target.arch }}.dylib
          if [ "${{ matrix.target.arch }}" = "arm64" ]; then
            # The app export is universal, so the CLI that ships inside it must be too.
            rustup target add x86_64-apple-darwin
            cargo build -p gpty --release --target x86_64-apple-darwin
            lipo -create -output release/gpty target/release/gpty target/x86_64-apple-darwin/release/gpty
          else
            cp target/release/gpty release/gpty
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpty-macos-${{ matrix.target.arch }}
          path: release/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GDExtension (release)
        run: cargo build -p gpty-gdext --release

      - name: Build CLI (release)
        run: cargo build -p gpty --release

      - name: Package
        run: |
          mkdir release
          copy target\release\gpty_gdext.dll release\gpty_gdext.windows.x86_64.dll
          copy target\release\gpty.exe release\gpty.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpty-windows-x86_64
          path: release/

  # ── Export standalone app + create GitHub Release ─────────────────────
  export-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot headless
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget unzip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          mkdir -p /tmp/godot-templates
          unzip -qo Godot_v4.7-stable_export_templates.tpz -d /tmp/godot-templates
          if [ -d /tmp/godot-templates/templates ]; then
            mv /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.7.stable/
          else
            mv /tmp/godot-templates/* ~/.local/share/godot/export_templates/4.7.stable/
          fi
          cd ~/.local/share/godot/export_templates/4.7.stable
          if [ -f macos.zip ]; then
            unzip -qo macos.zip "macos_template.app/Contents/MacOS/*" -d .
          fi
          ls -la ~/.local/share/godot/export_templates/4.7.stable/

      - name: Download GDExtension artifacts
        uses: actions/download-artifact@v4
        with:
          path: gdext-artifacts

      - name: Stage GDExtension binaries into godot/bin/
        run: |
          mkdir -p godot/bin
          find gdext-artifacts -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | while read f; do
            cp "$f" godot/bin/
          done
          ls -la godot/bin/

      - name: Import project
        run: godot --headless --path godot --import

      - name: Export Linux
        run: |
          B="$GITHUB_WORKSPACE/dist/gpty-${VERSION}-linux-x86_64"
          mkdir -p "$B"
          # The CLI owns the name `gpty`; the export ships beside it as `gpty-gui`
          # so `gpty <command>` can auto-spawn it (see the CLI's GUI discovery).
          godot --headless --path godot --export-release "Linux/X11" "$B/gpty-gui"
          cp gdext-artifacts/gpty-linux-x86_64/gpty "$B/"
          cp LICENSE LICENSE-EXCEPTIONS.md "$B/"
          tar -czf "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-linux-x86_64.tar.gz" -C "$GITHUB_WORKSPACE/dist" "gpty-${VERSION}-linux-x86_64"

      - name: Export Windows
        run: |
          B="$GITHUB_WORKSPACE/dist/gpty-${VERSION}-windows-x86_64"
          mkdir -p "$B"
          godot --headless --path godot --export-release "Windows Desktop" "$B/gpty-gui.exe"
          cp godot/bin/gpty_gdext.windows.x86_64.dll "$B/" 2>/dev/null || true
          cp gdext-artifacts/gpty-windows-x86_64/gpty.exe "$B/"
          cp LICENSE LICENSE-EXCEPTIONS.md "$B/"
          cd "$GITHUB_WORKSPACE/dist" && zip -r "gpty-${VERSION}-windows-x86_64.zip" "gpty-${VERSION}-windows-x86_64"

      - name: Export macOS
        run: |
          godot --headless --path godot --export-release "macOS" "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip"
          # zip would happily create the archive itself, which would ship a
          # licenses-only download if the export above produced nothing.
          test -s "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip" || { echo "macOS export produced no archive"; exit 1; }
          # The bundle keeps its own name (the preset decides it); the CLI lands
          # next to it, and the CLI discovers the app under /Applications too.
          zip -j "$GITHUB_WORKSPACE/dist/gpty-${VERSION}-macos.zip" LICENSE LICENSE-EXCEPTIONS.md \
            gdext-artifacts/gpty-macos-arm64/gpty

      - name: Copy GDExtension artifacts for release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/gdextension"
          find gdext-artifacts -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} "$GITHUB_WORKSPACE/dist/gdextension/" \;

      # Entry names match the published asset names (flat basenames), so a
      # downloaded file can be checked against its own line. Fails loudly when
      # an expected artifact is missing rather than publishing a short list.
      - name: Generate SHA256 checksums
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "gpty-${VERSION}-linux-x86_64.tar.gz" \
                    "gpty-${VERSION}-windows-x86_64.zip" \
                    "gpty-${VERSION}-macos.zip" > SHA256SUMS
          (cd gdextension && sha256sum *) >> SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gpty-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/gpty-${{ github.ref_name }}-windows-x86_64.zip
            dist/gpty-${{ github.ref_name }}-macos.zip
            dist/gdextension/*
            dist/SHA256SUMS
          # A release that is silently missing an asset is worse than a failed job.
          fail_on_unmatched_files: true
          # The releases API prepends this body to the generated notes.
          body: |
            ### Verifying your download

            Every uploaded asset is listed in `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS                  # Linux
            shasum -a 256 -c SHA256SUMS              # macOS
            certutil -hashfile <asset> SHA256        # Windows
            ```

            Run that from the folder holding your download. Lines for assets you did
            not download report as missing — only your file's line has to say `OK`.

            Checksums catch a corrupted or tampered download in transit; they are not
            a signature. Release artifacts are unsigned (see SECURITY.md).
          generate_release_notes: true
