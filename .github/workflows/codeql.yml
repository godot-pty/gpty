name: CodeQL

on:
  # Committed as advanced setup; the repository's default setup is off. Scans
  # run where the code is reviewed and on a schedule - never on a push, so a
  # change to Markdown or to these workflows does not spend a scan, and a
  # dormant tree still picks up a new query pack every week.
  # `workflow_dispatch` exists so the file can be exercised after an edit.
  pull_request:
    branches: [main, master]
    # The same documentation-only set the code workflow ignores: a note edit
    # cannot change what the scan analyses.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "godot/knowledge.json"
      - "LICENSE"
  schedule:
    # Thursdays, 23:30 UTC (the slot GitHub's generator picked). An odd minute
    # on purpose: the top of the hour is the busiest for scheduled jobs.
    - cron: "30 23 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # A stuck extractor must fail in minutes rather than at the six-hour cap.
    timeout-minutes: 20
    # A pull request from a fork cannot upload SARIF - its token is read-only
    # for `security-events` - so the scan is skipped there instead of failing
    # on the upload. Same-repo branches and the weekly run cover the code.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      # Only `security-events: write` writes; the rest is what the scan reads.
      contents: read
      packages: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # What the repository contains, and what default setup detected before
        # it was turned off: the OMP events extension is JavaScript, the
        # scripts are Python, and the workflows themselves are `actions`.
        # Rust has a CodeQL extractor (preview) and is the code that matters
        # most here. GDScript has none, so it is not listed.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Placeholder for a language that needs a build; every entry above is
      # buildless today, so this stays inert rather than deleting the hook the
      # CodeQL docs point at.
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "Set a manual build command here, or use build-mode: none."
          exit 1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
