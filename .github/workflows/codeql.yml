name: CodeQL

on:
  # Committed as advanced setup; the repository's default setup is off. Scans
  # run on every pull request to a protected branch, on every merge-queue
  # group, and on a schedule - never on a push. The PR filter has no path
  # exclusions because CodeQL is a required context on `main`: a docs-only PR
  # must still report it, or the ruleset would wait on a check that never
  # starts. A dormant tree still picks up a new query pack every week.
  # `workflow_dispatch` exists so the file can be exercised after an edit.
  pull_request:
    branches: [main, "release/v*"]
  merge_group:
  schedule:
    # Thursdays, 23:30 UTC (the slot GitHub's generator picked). An odd minute
    # on purpose: the top of the hour is the busiest for scheduled jobs.
    - cron: "30 23 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    # A stuck extractor must fail in minutes rather than at the six-hour cap.
    timeout-minutes: 20
    # A pull request from a fork cannot upload SARIF - its token is read-only
    # for `security-events` - so the scan is skipped there instead of failing
    # on the upload. Same-repo branches and the weekly run cover the code.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      # Only `security-events: write` writes; the rest is what the scan reads.
      contents: read
      packages: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # What the repository contains, and what default setup detected before
        # it was turned off: the OMP events extension is JavaScript, the
        # scripts are Python, and the workflows themselves are `actions`.
        # Rust has a CodeQL extractor (preview) and is the code that matters
        # most here. GDScript has none, so it is not listed.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Placeholder for a language that needs a build; every entry above is
      # buildless today, so this stays inert rather than deleting the hook the
      # CodeQL docs point at.
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "Set a manual build command here, or use build-mode: none."
          exit 1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
