name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "crates/**/README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Copy docs into site
        run: |
          mkdir -p site/content/repo/crates/godopty-{core,gdext,cli}
          cp README.md CHANGELOG.md ROADMAP.md AGENTS.md site/content/repo/
          cp crates/godopty-core/README.md site/content/repo/crates/godopty-core/
          cp crates/godopty-gdext/README.md site/content/repo/crates/godopty-gdext/
          cp crates/godopty-cli/README.md site/content/repo/crates/godopty-cli/

      - name: Build site
        run: cd site && hugo

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
