name: CI

on:
  # A documentation-only push runs none of these jobs; the Docs workflow is
  # its gate (it builds the site, runs docs-check and verifies the knowledge
  # bundle). A roadmap or note edit cannot change what any job here tests -
  # no Rust or GDScript test reads `docs/`, and the bundle is generated data
  # the Docs job re-checks. A full run is ~4 minutes warm and can reach ~30
  # when the Windows vcpkg tree has to rebuild, which is a lot to spend on a
  # Markdown edit. Anything outside this list (workflows, scripts, crates,
  # godot/, the smoke) still runs the full suite.
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "godot/knowledge.json"
      - "LICENSE"
  pull_request:
    branches: [main, master]
    # Kept as a literal copy rather than a YAML anchor: the anchor would be
    # valid YAML, but this file is the thing that decides whether CI runs at
    # all, and an alias the server's parser rejected would fail closed with no
    # job to say so.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "godot/knowledge.json"
      - "LICENSE"

# Least privilege: every job here only reads the repository. Without this
# block each job inherits the repository default token scope, which is handed
# to third-party actions, so a compromised action would hold whatever write
# scopes the default grants. No job is exempt: the dependency audit runs
# `cargo audit` directly rather than an action that publishes a Check Run,
# which would need `checks: write` and could never work for a fork PR anyway.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Workflow linting (YAML syntax) ────────────────────────────────────
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint workflows
        run: ./scripts/lint-workflows

  # ── Rust tests (core + gdext + cli) ──────────────────────────────────
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The built prefix, not the source or build trees: `media-deps` skips
          # when its `.stamp` (version + components checksum + platform +
          # assembler) matches and still writes the job env, so a restored
          # prefix turns a ~105 s build into a 2 s check. A stale cache costs
          # time - the stamp forces the rebuild - never correctness.
          path: dist/ffmpeg/linux-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        # Pinned minimal FFmpeg (scripts/media-deps); gpty-gdext links it, so
        # every job that compiles or loads the extension needs the prefix.
        run: ./scripts/media-deps

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace -- --test-threads=1

      # Serial first (deterministic baseline), then default parallelism:
      # the second pass is what catches tests that only pass because nothing
      # else runs concurrently (shared statics, fixed paths).
      - name: Run Rust tests (parallel)
        run: cargo test --workspace

      # The peer-credential code is `cfg(target_os)`-selected, so the BSD arm is
      # dead code on this runner: this is the only place it gets compiled.
      # illumos and NetBSD cannot be checked the same way (their bundled SQLite
      # does not build there); those two arms are probe-verified in the ROADMAP.
      - name: Cross-check the BSD peer-credential arm
        run: |
          rustup target add x86_64-unknown-freebsd
          cargo check -p gpty-ipc --target x86_64-unknown-freebsd

  # ── OMP extension tests (Node, no omp install) ────────────────────────
  omp-events-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run @gpty/omp-events tests
        run: node --test
        working-directory: extensions/gpty-omp-events

  # ── Rust Windows compile check (release parity) ───────────────────────
  # The release workflow builds gpty-gdext on windows-latest; without this
  # job, Windows-only compile errors only surface at tag time.
  rust-windows:
    runs-on: windows-latest
    # Same cap as windows-smoke: it runs the same `Build media dependencies`,
    # so a cold vcpkg rebuild has to fit here too, and a stuck rustc must not
    # hold the runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Cache vcpkg FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: vcpkg-ffmpeg-${{ runner.os }}-9.0.2
          restore-keys: |
            vcpkg-ffmpeg-${{ runner.os }}-

      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The repo prefix (DLLs + licenses + the `.stamp`), keyed like the
          # Linux one. Without it a Windows run always reached
          # `vcpkg install ffmpeg`, and when the runner image's vcpkg moved
          # past the cached packages that call rebuilt FFmpeg from source:
          # measured at 26.5 minutes on 2026-10-30, which a job cap turned
          # into a cancelled run. With the prefix cached, the skip path
          # writes the vcpkg environment (media-deps `write_env_vcpkg`) and
          # vcpkg is never consulted on a warm run; when vcpkg's tree is
          # missing the script reinstalls it, so the cache can only save time.
          path: dist/ffmpeg/windows-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT || 'C:/vcpkg' }}
        run: ./scripts/media-deps

      - name: Check Windows build
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo check --workspace

      # One binary, no Godot: asserts the process DACL directly (memory denied,
      # peer-check and terminate masks kept) so a DACL regression fails in
      # seconds instead of inside the full GUI smoke.
      - name: Process hardening (Windows DACL)
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test -p gpty-core --test windows_hardening -- --nocapture

  # ── GDScript tests (GUT headless) ────────────────────────────────────
  gut-tests:
    runs-on: ubuntu-latest
    # The same guard as the Windows jobs: this one boots Godot and the GUI, so
    # a hang must fail in minutes rather than at GitHub's six-hour cap.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Godot headless
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget unzip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          # The release tag is mutable; the hash is the pin (from the release's
          # SHA512-SUMS.txt, verified against the downloaded archive).
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  Godot_v4.7.2-stable_linux.x86_64.zip" | sha512sum -c -
          unzip Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The built prefix, not the source or build trees: `media-deps` skips
          # when its `.stamp` (version + components checksum + platform +
          # assembler) matches and still writes the job env, so a restored
          # prefix turns a ~105 s build into a 2 s check. A stale cache costs
          # time - the stamp forces the rebuild - never correctness.
          path: dist/ffmpeg/linux-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        run: ./scripts/media-deps

      - name: Build GDExtension
        run: cargo build -p gpty-gdext

      - name: Install GDExtension library
        run: cp target/debug/libgpty_gdext.so godot/bin/libgpty_gdext.linux.x86_64.so

      - name: Import project
        run: godot --headless --path godot --import

      - name: Run GUT tests
        # gut-check owns the command and validates the run: GUT exits 0 after
        # a parse error aborts it with most of the suite unexecuted.
        run: ./scripts/gut-check

      - name: Live pane-API smoke
        # One harness for every platform (Unix socket here, named pipe in the
        # windows-smoke job); it builds the CLI and the extension itself.
        run: python3 ./scripts/smoke_pane_api.py

  # ── Windows runtime smoke (pane API over named pipes) ─────────────────
  # rust-windows only compiles the Windows target — nothing ever ran Godot on
  # Windows, so the named-pipe control and event listeners and the pane API
  # were inferred from source. This job boots the GUI headless on
  # windows-latest and drives the CLI against it: the same smoke harness as
  # Linux, whose only platform difference is the transport.
  windows-smoke:
    runs-on: windows-latest
    # A hung Godot or cargo would otherwise hold the runner to GitHub's
    # six-hour cap (gut-check's notes record one such hang on Windows). Green
    # is ~4.5 minutes here, but a cold vcpkg FFmpeg rebuild inside `Build
    # media dependencies` took 26.5 minutes once, so the cap has to clear that
    # plus the rest of the job under runner load.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Cache vcpkg FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: vcpkg-ffmpeg-${{ runner.os }}-9.0.2
          restore-keys: |
            vcpkg-ffmpeg-${{ runner.os }}-

      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The repo prefix (DLLs + licenses + the `.stamp`), keyed like the
          # Linux one. Without it a Windows run always reached
          # `vcpkg install ffmpeg`, and when the runner image's vcpkg moved
          # past the cached packages that call rebuilt FFmpeg from source:
          # measured at 26.5 minutes on 2026-10-30, which a job cap turned
          # into a cancelled run. With the prefix cached, the skip path
          # writes the vcpkg environment (media-deps `write_env_vcpkg`) and
          # vcpkg is never consulted on a warm run; when vcpkg's tree is
          # missing the script reinstalls it, so the cache can only save time.
          path: dist/ffmpeg/windows-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT || 'C:/vcpkg' }}
        run: ./scripts/media-deps

      - name: Build CLI and extension
        shell: bash
        # The smoke builds both itself, but it reports a failure as a summary
        # line. Two windows-smoke runs failed with `cargo build ... exited 101`
        # and the only visible detail was build-script metadata, which named
        # nothing: a cargo error belongs in a step of its own. The smoke's own
        # build then finds the artifacts current and costs seconds.
        run: cargo build -p gpty-gdext -p gpty

      - name: Install Godot (Windows, headless)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          # The release tag is mutable; the hash is the pin (from the release's
          # SHA512-SUMS.txt, verified against the downloaded archive).
          $expected = '83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993'
          $actual = (Get-FileHash godot.zip -Algorithm SHA512).Hash.ToLower()
          if ($actual -ne $expected) { throw "Godot archive checksum mismatch: $actual" }
          Expand-Archive godot.zip -DestinationPath godot-editor
          $exe = Get-ChildItem godot-editor -Filter 'Godot_v4.7.2-stable_win64.exe' | Select-Object -First 1
          Rename-Item -Path $exe.FullName -NewName godot.exe
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: Live pane-API smoke (Windows)
        shell: pwsh
        # GODOT is explicit: the step above adds the editor to PATH for later
        # steps, and which() is not worth relying on for a download.
        run: |
          python --version
          python ./scripts/smoke_pane_api.py
        env:
          GODOT: ${{ github.workspace }}\godot-editor\godot.exe

      - name: Import project
        if: ${{ !cancelled() }}
        shell: bash
        # `godot` is on PATH from the download step; the smoke imported the
        # project already, and GUT resolves `class_name` globals from that cache.
        # Runs whether or not the smoke passed: a failing smoke must not cost
        # the run its second, independent signal.
        run: godot --headless --path godot --import

      - name: GUT tests (Windows)
        if: ${{ !cancelled() }}
        # The same gate as Linux, under the runner's Git Bash: `gut-check` owns
        # the command and validates the run (a parse error aborts GUT after a
        # few scripts and still exits 0), so a Windows suite that stops early
        # cannot pass as green. GUT here runs against the platform default shell
        # — cmd.exe — since the suite reads `default_shell_command()`.
        shell: bash
        run: ./scripts/gut-check
        env:
          GODOT: ${{ github.workspace }}\godot-editor\godot.exe

  # ── Rust formatting ───────────────────────────────────────────────────
  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Dependency audit ──────────────────────────────────────────────────
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Audit the committed Cargo.lock. Never regenerate here:
      # generate-lockfile re-resolves to latest-compatible versions and
      # silently rewrites the pinned graph, letting a fresh advisory in an
      # unpinned dependency fail CI independently of what we ship.
      - name: Verify Cargo.lock exists
        run: test -f Cargo.lock

      # Plain `cargo audit`, deliberately not rustsec/audit-check: that action
      # publishes a Check Run when it finds something, which needs `checks:
      # write` handed to a third-party action, and a fork PR's token can never
      # create checks at all. `--deny warnings` makes an `unsound` advisory
      # fail here with the advisory text instead of an API error, and the same
      # flag in scripts/ci-check keeps the local gate and CI in agreement.
      # The version is pinned so the tool's policy cannot change under a green
      # build; there is no install-action entry for cargo-audit, so this is the
      # one place a build step costs a couple of minutes.
      - name: Cache cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The installed binary, keyed on the pinned version. A miss builds it
          # from crates.io with `--locked`, so a hit is the same artifact this
          # job would make (measured: 173 s of every run went to compiling a
          # tool that then ran in 3 s). The version in the key is what keeps
          # the tool's policy from drifting under a green build.
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2

      - name: Run cargo-audit
        run: cargo audit --deny warnings
