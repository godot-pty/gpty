name: CI

on:
  # A workflow-level paths filter leaves a required check pending forever, so
  # the `changes` job classifies the diff inside the workflow and every job
  # below either runs or is reported as skipped (skipped satisfies a required
  # check). Pull requests and merge-queue groups are the code gate; a push to
  # main runs no CI because the merge group was just tested. Release-branch
  # pushes still run it.
  push:
    branches: ["release/v*"]
  pull_request:
    branches: [main, "release/v*"]
  merge_group:

# Least privilege: every job here only reads the repository. Without this
# block each job inherits the repository default token scope, which is handed
# to third-party actions, so a compromised action would hold whatever write
# scopes the default grants. No job is exempt: the dependency audit runs
# `cargo audit` directly rather than an action that publishes a Check Run,
# which would need `checks: write` and could never work for a fork PR anyway.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Changed-path classifier ───────────────────────────────────────────
  # Docs-only diffs skip the Rust/Godot/Windows jobs. A workflow-level path
  # filter cannot do this (the required context would never be reported); a
  # skipped job reports success, so a full-suite job gated on `code` keeps
  # the required check satisfied.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "no base commit; running the full suite"
            exit 0
          fi
          if ! git diff --name-only "$BASE" "$HEAD" > /tmp/changed; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "cannot diff $BASE..$HEAD; running the full suite"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              docs/*|assets/site-icons/*|*.md|godot/knowledge.json|godot/docs.json|LICENSE|LICENSE-EXCEPTIONS.md|scripts/docs-check|scripts/check-capabilities|scripts/build-wiki|scripts/build-docs) ;;
              *) code=true ;;
            esac
          done < /tmp/changed
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf 'changed files: %s; code=%s\n' "$(wc -l < /tmp/changed)" "$code"

  # ── Workflow linting (YAML syntax) ────────────────────────────────────
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: ./scripts/lint-workflows

  # ── Documentation gates (links, roadmap rows, knowledge bundle) ──────
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check docs
        run: |
          python3 scripts/docs-check
          ./scripts/check-capabilities
          python3 scripts/build-wiki --check
          python3 scripts/build-docs --check

      # The cheap half of scripts/ci-check that CI did not mirror. These read
      # source or generated data and finish in seconds; they belong in the
      # gate, not only in a contributor's local run.
      - name: Check release versions
        run: ./scripts/release-prepare --check

      - name: Check the MCP descriptor
        run: python3 scripts/mcp-registry check

      - name: Check the GDExtension surface
        run: ./scripts/check-ffi-surface

      - name: Check log hygiene
        run: ./scripts/check-log-hygiene

      - name: Check theme tokens
        run: ./scripts/check-theme-tokens

      - name: Check test guards
        run: ./scripts/check-test-guards

      - name: Check the cost stamp and chart
        run: |
          ./scripts/measure-cost --stamp
          ./scripts/render-cost-chart --check --require-current

  # ── Commit policy (DCO + Conventional Commits) ───────────────────────
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every non-bot commit
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          rc=0
          while IFS= read -r sha; do
            author="$(git log -1 --format=%an "$sha")"
            case "$author" in
              *"[bot]") continue ;;
            esac
            msg="$(mktemp)"
            git log -1 --format=%B "$sha" > "$msg"
            if ! ./githooks/commit-msg "$msg"; then
              echo "::error::commit $sha failed the DCO/Conventional Commits check"
              rc=1
            fi
            rm -f "$msg"
          done < <(git rev-list --no-merges --reverse "origin/$BASE..HEAD")
          exit "$rc"

  # ── Rust tests (core + gdext + cli) ──────────────────────────────────
  rust-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: ./scripts/install-rust --target x86_64-unknown-freebsd

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The built prefix, not the source or build trees: `media-deps` skips
          # when its `.stamp` (version + components checksum + platform +
          # assembler) matches and still writes the job env, so a restored
          # prefix turns a ~105 s build into a 2 s check. A stale cache costs
          # time - the stamp forces the rebuild - never correctness.
          path: dist/ffmpeg/linux-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        # Pinned minimal FFmpeg (scripts/media-deps); gpty-gdext links it, so
        # every job that compiles or loads the extension needs the prefix.
        run: ./scripts/media-deps

      - name: Verify Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked -- --test-threads=1

      # Serial first (deterministic baseline), then default parallelism:
      # the second pass is what catches tests that only pass because nothing
      # else runs concurrently (shared statics, fixed paths).
      - name: Run Rust tests (parallel)
        run: cargo test --workspace --locked

      # The peer-credential code is `cfg(target_os)`-selected, so the BSD arm is
      # dead code on this runner: this is the only place it gets compiled.
      # illumos and NetBSD cannot be checked the same way (their bundled SQLite
      # does not build there); those two arms are probe-verified in the ROADMAP.
      - name: Cross-check the BSD peer-credential arm
        run: cargo check --locked -p gpty-ipc --target x86_64-unknown-freebsd

  # ── OMP extension tests (Node, no omp install) ────────────────────────
  omp-events-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run @gpty/omp-events tests
        run: node --test
        working-directory: extensions/gpty-omp-events

  # ── GDScript tests (GUT headless) ────────────────────────────────────
  gut-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # The same guard as the Windows jobs: this one boots Godot and the GUI, so
    # a hang must fail in minutes rather than at GitHub's six-hour cap.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Godot
        # The version and SHA512 live in scripts/godot-version.json. The step
        # adds the directory to PATH and sets GODOT for the backend steps.
        run: python3 scripts/install-godot editor --dest "$HOME/godot"

      - name: Install Rust toolchain
        run: ./scripts/install-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The built prefix, not the source or build trees: `media-deps` skips
          # when its `.stamp` (version + components checksum + platform +
          # assembler) matches and still writes the job env, so a restored
          # prefix turns a ~105 s build into a 2 s check. A stale cache costs
          # time - the stamp forces the rebuild - never correctness.
          path: dist/ffmpeg/linux-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        run: ./scripts/media-deps

      - name: Build GDExtension
        run: cargo build --locked -p gpty-gdext

      - name: Install GDExtension library
        run: cp target/debug/libgpty_gdext.so godot/bin/libgpty_gdext.linux.x86_64.so

      - name: Import project
        run: godot --headless --path godot --import

      - name: Capture harness loads
        # `godot -s` compiles the entry script before autoloads exist; a
        # project class referenced in tests/bench/ui_capture.gd breaks every
        # capture while GUT stays green. --list only loads the harness and
        # needs no display (ui-capture-check itself cannot run in CI).
        run: ./scripts/ui-capture --list >/dev/null

      - name: Run GUT tests
        # gut-check owns the command and validates the run: GUT exits 0 after
        # a parse error aborts it with most of the suite unexecuted.
        run: ./scripts/gut-check

      - name: Live pane-API smoke
        # One harness for every platform (Unix socket here, named pipe in the
        # windows job); it builds the CLI and the extension itself.
        run: python3 ./scripts/smoke_pane_api.py

      - name: Install Xvfb and a software renderer
        run: sudo apt-get update -y && sudo apt-get install -y xvfb xauth libgl1-mesa-dri mesa-utils mesa-vulkan-drivers

      - name: Renderer smoke (real display)
        # --renderer-smoke runs the project default first and then opengl3, so
        # lavapipe supplies Vulkan and llvmpipe the GL path. --headless would
        # select the dummy renderer and prove nothing.
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            python3 ./scripts/smoke_pane_api.py --renderer-smoke opengl3

  # ── Windows compile, tests and runtime smoke ──────────────────────────
  # One windows-2025 job: compile parity, the Windows-only unit tests, the
  # headless pane-API smoke, the renderer fallback and GUT. The old split ran
  # `rust-windows` and `windows-smoke` side by side, each installing a
  # toolchain, restoring vcpkg and running `media-deps` for the same tree.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    # The old smoke cap was 45 with a 26.5-min cold vcpkg rebuild recorded;
    # the merged job adds the compile and test steps on top.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: ./scripts/install-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache vcpkg FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\downloads
          key: vcpkg-ffmpeg-${{ runner.os }}-9.0.2
          restore-keys: |
            vcpkg-ffmpeg-${{ runner.os }}-

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The repo prefix (DLLs + licenses + the `.stamp`), keyed like the
          # Linux one. Without it a Windows run always reached
          # `vcpkg install ffmpeg`, and when the runner image's vcpkg moved
          # past the cached packages that call rebuilt FFmpeg from source:
          # measured at 26.5 minutes on 2026-10-30, which a job cap turned
          # into a cancelled run. With the prefix cached, the skip path
          # writes the vcpkg environment (media-deps `write_env_vcpkg`) and
          # vcpkg is never consulted on a warm run; when vcpkg's tree is
          # missing the script reinstalls it, so the cache can only save time.
          path: dist/ffmpeg/windows-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        shell: bash
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT || 'C:/vcpkg' }}
        run: ./scripts/media-deps

      - name: Check Windows build
        env:
          RUSTFLAGS: -Dwarnings
        # `--tests` too: a helper or import that is dead only on Windows
        # (`#[cfg(unix)]` tests, a Unix-only fixture) compiles in no other
        # job, and `cargo check` alone never builds a test profile.
        run: cargo check --workspace --tests --locked

      # The named-pipe arm is Windows-only, so its unit test never runs on the
      # Unix jobs; without this step the first-instance claim logic is only
      # type-checked here.
      - name: Run gpty-ipc tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked -p gpty-ipc

      # One binary, no Godot: asserts the process DACL directly (memory denied,
      # peer-check and terminate masks kept) so a DACL regression fails in
      # seconds instead of inside the full GUI smoke.
      - name: Process hardening (Windows DACL)
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked -p gpty-core --test windows_hardening -- --nocapture

      - name: Install Godot
        id: godot
        shell: bash
        # The version and SHA512 live in scripts/godot-version.json; the script
        # adds the directory to PATH and sets GODOT.
        run: python scripts/install-godot editor --dest "$GITHUB_WORKSPACE/godot-editor"

      - name: Build CLI and extension
        shell: bash
        # The smoke builds both itself, but it reports a failure as a summary
        # line; a cargo error belongs in a step of its own. The smoke's own
        # build then finds the artifacts current and costs seconds.
        run: cargo build --locked -p gpty-gdext -p gpty

      - name: Live pane-API smoke (Windows)
        shell: pwsh
        run: |
          python --version
          python ./scripts/smoke_pane_api.py

      - name: Import project
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        shell: bash
        # `godot` is on PATH from the install step; the smoke imported the
        # project already, and GUT resolves `class_name` globals from that cache.
        # Runs whether or not the smoke passed: a failing smoke must not cost
        # the run its second, independent signal.
        run: godot --headless --path godot --import

      - name: Renderer smoke (real display)
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        # `--headless` selects the dummy renderer, so the startup `[renderer]`
        # line is the only way to see which backend initialized. The runner has
        # no GPU: the default launch falls back to D3D12/WARP or ANGLE, and the
        # two forced launches prove both compiled paths start. 120 s per launch,
        # owned by the script.
        shell: pwsh
        run: python ./scripts/smoke_pane_api.py --renderer-smoke d3d12 opengl3_angle

      - name: GUT tests (Windows)
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        # The same gate as Linux, under the runner's Git Bash: `gut-check` owns
        # the command and validates the run (a parse error aborts GUT after a
        # few scripts and still exits 0), so a Windows suite that stops early
        # cannot pass as green. GUT here runs against the platform default shell
        # — cmd.exe — since the suite reads `default_shell_command()`.
        shell: bash
        run: ./scripts/gut-check

  # ── macOS compile parity ──────────────────────────────────────────────
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: ./scripts/install-rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/ffmpeg/macos-arm64
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ffmpeg-

      - name: Build media dependencies
        run: ./scripts/media-deps

      - name: Check the macOS build
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo check --workspace --tests --locked

  # ── Rust formatting ───────────────────────────────────────────────────
  rust-fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: ./scripts/install-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Dependency audit ──────────────────────────────────────────────────
  cargo-audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: ./scripts/install-rust

      # Audit the committed Cargo.lock. Never regenerate here:
      # generate-lockfile re-resolves to latest-compatible versions and
      # silently rewrites the pinned graph, letting a fresh advisory in an
      # unpinned dependency fail CI independently of what we ship.
      - name: Verify Cargo.lock exists
        run: test -f Cargo.lock

      # Plain `cargo audit`, deliberately not rustsec/audit-check: that action
      # publishes a Check Run when it finds something, which needs `checks:
      # write` handed to a third-party action, and a fork PR's token can never
      # create checks at all. `--deny warnings` makes an `unsound` advisory
      # fail here with the advisory text instead of an API error, and the same
      # flag in scripts/ci-check keeps the local gate and CI in agreement.
      # The version is pinned so the tool's policy cannot change under a green
      # build; there is no install-action entry for cargo-audit, so this is the
      # one place a build step costs a couple of minutes.
      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The installed binary, keyed on the pinned version. A miss builds it
          # from crates.io with `--locked`, so a hit is the same artifact this
          # job would make (measured: 173 s of every run went to compiling a
          # tool that then ran in 3 s). The version in the key is what keeps
          # the tool's policy from drifting under a green build.
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked --version 0.22.2

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      # The fuzz workspace is outside the repository workspace and commits its
      # own lockfile, so the audit above never reads it - and GitHub's
      # dependency graph does. That is how RUSTSEC-2026-0459 (`libsqlite3-sys`
      # 0.28.0, left behind by a stale `fuzz/Cargo.lock`) reached Scorecard's
      # Vulnerabilities check while this job was green. `--locked` keeps the
      # sync check from re-resolving the very file it is checking.
      - name: Verify the fuzz lockfile is in sync
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Run cargo-audit on the fuzz workspace
        run: cargo audit --file fuzz/Cargo.lock --deny warnings

  # ── Dependency policy: licences, sources, duplicate versions ──────────
  #
  # `cargo audit` above owns advisories; this owns the rest of `deny.toml`:
  # the licence allow-list, crates.io-only sources, yanked crates, and
  # duplicate versions as a warning. The action pins the cargo-deny version,
  # so the policy cannot drift under a green build, and `[graph] all-features`
  # keeps the checked graph identical to the local gate's.
  cargo-deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the dependency policy
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  # ── Fuzz targets compile (nightly; runs are the scheduled Fuzz workflow) ──
  #
  # Build only, on every pull request: a run needs minutes per target, so the
  # bounded runs live in .github/workflows/fuzz.yml. This job keeps the targets
  # from rotting — a target that stops compiling (an API moves, a helper is
  # made private again) fails on the change that did it instead of weeks later.
  fuzz-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        run: ./scripts/install-rust --manifest-path fuzz

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The fuzz crate is its own workspace, so its target dir is
          # `fuzz/target`; the registry is shared with the stable jobs.
          path: |
            ~/.cargo/registry
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Cache cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Cache FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/ffmpeg/linux-x86_64
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('scripts/media-deps', 'crates/gpty-media/components.txt') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-

      - name: Build media dependencies
        run: ./scripts/media-deps

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked --version 0.13.2

      - name: Build the fuzz targets
        # install-rust --manifest-path fuzz exported RUSTUP_TOOLCHAIN for the
        # rest of the job; the root rust-toolchain.toml still pins local work.
        run: |
          source dist/ffmpeg/linux-x86_64/env.sh
          cargo fuzz build

  # ── Aggregate gate ────────────────────────────────────────────────────
  # One required context instead of a list of job names. `always()` makes it
  # run even when an upstream job failed; `skipped` is a pass (the docs-only
  # fast path). Anything else - failure, cancelled, abandoned, timed_out -
  # fails: GitHub can abandon a queued job without running a step, and that
  # is a missing platform proof, not a pass. The one exception is macOS:
  # GitHub repeatedly abandons a queued macOS runner without running a step,
  # and the job still runs whenever a runner is available, so an
  # abandoned/cancelled macOS job is a warning. A real macOS failure (or a
  # timeout) still fails. Keep this `needs` list complete when a job is
  # added.
  ci-gate:
    if: always()
    needs: [changes, lint-workflows, docs, commit-lint, rust-tests, omp-events-tests, windows, macos, gut-tests, rust-fmt, cargo-audit, cargo-deny, fuzz-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failures="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")"
          macos="$(jq -r '.macos.result // "missing"' <<<"$RESULTS")"
          case "$macos" in
            abandoned|cancelled)
              echo "::warning::macOS was $macos before a runner ran it; the job remains in the matrix when a runner is available, and a real macOS failure still fails"
              failures="$(printf '%s\n' "$failures" | grep -v '^macos: ' || true)"
              ;;
          esac
          if [ -n "$failures" ]; then
            echo "::error::CI gate failed"
            printf '%s\n' "$failures"
            exit 1
          fi
          echo "CI gate passed (skipped jobs are the docs-only fast path)"
